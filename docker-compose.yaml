services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectpals-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - projectpals

  nginx:
    image: nginx:1.27-alpine
    container_name: projectpals-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - projectpals

  node:
    image: node:22-alpine
    container_name: projectpals-node
    working_dir: /var/www/html
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_DEV_SERVER_URL=http://localhost:5174
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    networks:
      - projectpals

  frontend:
    image: node:22-alpine
    container_name: projectpals-frontend
    working_dir: /usr/src/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - projectpals

  db:
    image: mysql:8.4
    container_name: projectpals-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: backend
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - projectpals

volumes:
  dbdata:

networks:
  projectpals:
    driver: bridge