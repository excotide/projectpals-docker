services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    image: projectpals-app:latest
    container_name: projectpals-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php/conf.d/performance.ini:/usr/local/etc/php/conf.d/99-performance.ini:ro
      - ./backend/docker/php-fpm/zz-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    depends_on:
      db:
        condition: service_healthy   # ← update ini, tunggu Oracle ready dulu
    networks:
      - projectpals

  # Reuses the image built by the `app` service (no separate build → no rebuild).
  scheduler:
    image: projectpals-app:latest
    container_name: projectpals-scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - projectpals

  # Enable when QUEUE_CONNECTION is switched from `sync` to `database`/`redis`.
  # With `sync`, jobs run inline (scheduler/web request) and no worker is needed.
  # queue:
  #   image: projectpals-app:latest
  #   container_name: projectpals-queue
  #   working_dir: /var/www/html
  #   command: php artisan queue:work --tries=3
  #   volumes:
  #     - ./backend:/var/www/html
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - projectpals

  nginx:
    image: nginx:1.27-alpine
    container_name: projectpals-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - projectpals

  node:
    image: node:22-alpine
    container_name: projectpals-node
    working_dir: /var/www/html
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_DEV_SERVER_URL=http://localhost:5174
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    networks:
      - projectpals

  frontend:
    image: node:22-alpine
    container_name: projectpals-frontend
    working_dir: /usr/src/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - projectpals

  warmup:
    image: curlimages/curl:8.8.0
    container_name: projectpals-warmup
    depends_on:
      app:
        condition: service_started
      nginx:
        condition: service_started
    command: >
      sh -c "
      echo 'Warming up backend...';
      for i in 1 2 3 4 5; do
        curl -sS -o /dev/null http://nginx/up || true;
        curl -sS -o /dev/null -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{}' http://nginx/api/auth/login || true;
      done;
      echo 'Warmup done.';
      "
    restart: 'no'
    networks:
      - projectpals

  db:
    image: gvenzl/oracle-free:latest
    container_name: projectpals-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: oracle123        # password untuk SYSTEM
      APP_USER: projectpals             # auto-bikin user khusus
      APP_USER_PASSWORD: pals_pass
    ports:
      - "1523:1521"
    volumes:
      - dbdata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 90s                 # Oracle butuh waktu startup lebih lama
    networks:
      - projectpals

volumes:
  dbdata:

networks:
  projectpals:
    driver: bridge